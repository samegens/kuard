name: Build kuard Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0

      # DOCKER_PASSWORD must be a Docker Hub Personal Access Token (PAT), not your account password.
      # Create one at https://hub.docker.com/settings/security
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build binary, create images, and push all versions
        run: make all-fakever-push
