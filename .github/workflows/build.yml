name: Build kuard Docker image

on:
  push:

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build images and test all versions
        run: make e2e-test

      # DOCKER_PASSWORD must be a Docker Hub Personal Access Token (PAT), not your account password.
      # Create one at https://hub.docker.com/settings/security
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push all versions
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        run: make all-fakever-push
